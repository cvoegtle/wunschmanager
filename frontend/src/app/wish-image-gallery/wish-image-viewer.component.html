<div class="wish-img-container" (click)="openZoom()" matTooltip="Klicken zum Vergrößern">
  <img [src]="image.url || image" alt="Wunsch-Bild" class="wish-img-preview">
  @if (deleteVisible) {
    <button mat-icon-button class="delete-image-btn" (click)="onDelete(); $event.stopPropagation()" matTooltip="Bild löschen">
      <mat-icon>delete</mat-icon>
    </button>
  }
</div>

<wish-image-zoom [image]="image"></wish-image-zoom>
